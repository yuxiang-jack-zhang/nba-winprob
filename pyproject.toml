[project]
name = "nba-winprob"
version = "0.1.0"
description = "NBA pregame and in-game win-probability models, served over FastAPI"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "xgboost>=2.1",
  "joblib>=1.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]

[project.scripts]
nba-winprob = "nba_winprob.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_winprob"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The backtest prints wide aligned report rows; wrapping them hurts more than it helps.
"papertrade/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nba_winprob", "backtest", "fetch"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
# pandas/sklearn/torch call sites return Any often enough that strict mode's
# warn_return_any is noise rather than signal here.
warn_return_any = false

[[tool.mypy.overrides]]
module = ["xgboost.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# papertrade/ holds its own tests next to the scripts they check.
testpaths = ["tests", "papertrade"]
markers = [
  "slow: needs the full Kaggle archive or a multi-minute ETL run",
]
